# Amplify custom headers for the clin web app (copied to ./customHttp.yml by
# `npm run site-config-clin`). Prod sets its headers with app-lambda-edge
# instead; its CSP lists (infrastructure: pennsieve-prod/.../app-lambda-edge)
# are the reference this policy follows, with the platform hosts on
# pennsieve.ai and Discover on prod (clin browses the prod catalogue).
#
# Every header value must be ONE line: the CSP below is a folded (>-) scalar,
# so the lines join with spaces. A literal newline in a value makes Amplify
# drop the header (the previous version of this file never served its CSP).
#
# Enforced. A new third party or platform host has to be added here (and to
# prod's list if prod uses it too), or the browser blocks it. Third parties
# are only those clin actually loads (POAM-006): Google reCAPTCHA (sign-up),
# Google Fonts, Google Analytics 4 (gtag.js from Tag Manager; sanitized page
# paths only, see src/utils/analytics.js), DuckDB-WASM (jsDelivr bundles,
# extensions.duckdb.org), ORCID, DOI citations (doi.org redirects to Crosscite,
# DataCite or Crossref by registrar), GitHub (app READMEs) and Cognito. Clin
# has no Sentry, ProdPad, New Relic or maps.
#
# 'unsafe-eval' stays: ajv compiles JSON schemas to functions
# (RecordSpecGenerator) and plotly's WebGL traces generate code at runtime.
#
# The Report-Only policy is the enforced one without 'unsafe-inline' and data:
# in script-src. Browsers report what it would block in the console without
# blocking it; once clin shows no reports, it replaces the enforced policy.
customHeaders:
  - pattern: "**"
    headers:
      - key: "Content-Security-Policy"
        value: >-
            default-src
            'self';
            script-src
            'unsafe-inline'
            'unsafe-eval'
            'wasm-unsafe-eval'
            'self'
            data:
            https://www.google.com/recaptcha/
            https://www.gstatic.com/recaptcha/
            https://www.googletagmanager.com
            https://cdn.jsdelivr.net/npm/@duckdb/;
            style-src
            'unsafe-inline'
            'self'
            https://fonts.googleapis.com;
            worker-src
            'self'
            blob:
            https://cdn.jsdelivr.net/npm/@duckdb/;
            img-src
            'self'
            data:
            blob:
            https://api.pennsieve.ai
            https://api2.pennsieve.ai
            https://workspace-assets.pennsieve.ai
            https://assets.pennsieve.ai
            https://assets.discover.pennsieve.io
            https://*.s3.amazonaws.com
            https://*.s3.us-east-1.amazonaws.com
            https://*.s3.af-south-1.amazonaws.com
            https://raw.githubusercontent.com
            https://*.githubusercontent.com
            https://www.googletagmanager.com
            https://*.google-analytics.com
            https://*.analytics.google.com;
            font-src
            'self'
            data:
            blob:
            https://fonts.gstatic.com;
            media-src
            blob:
            https://api.pennsieve.ai
            https://api2.pennsieve.ai
            https://*.s3.amazonaws.com
            https://*.s3.us-east-1.amazonaws.com
            https://*.s3.af-south-1.amazonaws.com;
            frame-src
            https://www.google.com/recaptcha/
            https://api.pennsieve.ai
            https://api2.pennsieve.ai
            https://orthogonal-viewer.pennsieve.ai;
            connect-src
            'self'
            wss://events.pennsieve.ai
            https://pub.orcid.org
            https://doi.org
            https://citation.doi.org
            https://citation.crosscite.org
            https://data.crosscite.org
            https://data.datacite.org
            https://api.datacite.org
            https://api.crossref.org
            https://www.googletagmanager.com
            https://*.google-analytics.com
            https://*.analytics.google.com
            https://api.pennsieve.ai
            wss://api.pennsieve.ai
            https://api2.pennsieve.ai
            https://cde-catalog.pennsieve.ai
