            https://api.pennsieve.io
            https://downloads.pennsieve.io
            https://discover.pennsieve.io
            https://assets.discover.pennsieve.io
            https://extensions.duckdb.org
            https://cdn.jsdelivr.net/npm/@duckdb/
            https://s3.amazonaws.com
            https://*.s3.amazonaws.com
            https://*.s3.us-east-1.amazonaws.com
            https://*.s3.af-south-1.amazonaws.com
            https://compute.pennsieve.ai
            https://*.compute.pennsieve.ai
            wss://compute.pennsieve.ai
